<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SugarClock Fleet{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='fleet.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('admin.device_list_page') }}">SugarClock Fleet</a>
    <nav><a href="{{ url_for('admin.device_list_page') }}">Devices</a><a href="{{ url_for('admin.releases_page') }}">Releases</a></nav>
    {% if admin_login %}<span class="login">{{ admin_login }}</span>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>window.fleetCsrf = {{ csrf_token|tojson }};</script>
  {% block scripts %}{% endblock %}
</body>
</html>
