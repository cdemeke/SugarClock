; PlatformIO Configuration for SugarClock (Ulanzi TC001)
; ESP32-WROOM-32D, 8x32 WS2812B RGB Matrix, 4MB Flash

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

; 4MB flash (detected on this TC001 variant)
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_custom.csv

; LittleFS for temporary config overlay
board_build.filesystem = littlefs

; Upload speed (lower for reliability with CH340)
upload_speed = 115200

; Serial monitor
monitor_speed = 115200

; Pre-build and post-build scripts
extra_scripts =
    pre:scripts/pre_build.py
    post:scripts/post_build.py

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_SM_SC_ONLY=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_ESP32_DEV
    -DFASTLED_ESP32_I2S=true

; Pinned library dependencies
lib_deps =
    fastled/FastLED@3.10.3
    marcmerlin/FastLED NeoMatrix@1.2.0
    marcmerlin/Framebuffer GFX@1.1.0
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.3
    mathieucarbou/ESPAsyncWebServer@3.6.0
    mathieucarbou/AsyncTCP@3.3.2
    h2zero/NimBLE-Arduino@2.5.0
