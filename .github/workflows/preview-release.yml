name: Signed preview firmware release

on:
  push:
    tags: ["preview-v*.*.*-*"]

concurrency:
  group: firmware-release-publishing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs the tag's tests, PlatformIO toolchain and third-party libraries. It never
  # sees the signing key, so a compromised dependency cannot steal it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            fleet/requirements.txt
      - run: pip install -r requirements-build.txt -r fleet/requirements.txt
      - name: Verify preview inputs and test
        env:
          PREVIEW_RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          prefix="preview-v${version}-"
          test "${PREVIEW_RELEASE_TAG#"${prefix}"}" != "${PREVIEW_RELEASE_TAG}"
          suffix="${PREVIEW_RELEASE_TAG#"${prefix}"}"
          [[ "${suffix}" =~ ^[1-9][0-9]*$ ]]
          python -m unittest discover -s tests -v
      - name: Build production-configured release candidate
        run: |
          pio run
          pio run -t buildfs
          python scripts/check_layout.py
          python -m unittest discover -s tests -p "test_ble*.py" -v
      - name: Collect unsigned release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p release
          cp VERSION release/VERSION
          cp protocol/compatibility.json release/mobile-protocol.json
          cp protocol/SUGARCLOCK_BLE_V1.md release/
          cp docs/BLE_MIGRATION.md release/
          cp .pio/build/esp32dev/firmware.bin "release/sugarclock-v${version}.bin"
          cp .pio/build/esp32dev/bootloader.bin release/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin release/partitions.bin
          cp .pio/build/esp32dev/littlefs.bin release/littlefs.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release/boot_app0.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release
          path: release/
          if-no-files-found: error
          retention-days: 1

  # Holds the signing key. Executes only this workflow revision's own signing and
  # guard scripts against the built files; no candidate code, no package installs.
  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ota-signing
    permissions:
      contents: write
    steps:
      - name: Load signing and publishing tools from workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: publishing-policy
          persist-credentials: false
      - name: Capture pinned legacy update offer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publishing-policy/scripts/release_guard.py --repository "${{ github.repository }}" snapshot --output "${{ runner.temp }}/latest-before.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-release
          path: release
      - name: Generate and verify signed preview manifest
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.OTA_SIGNING_KEY_B64 }}
          PREVIEW_RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OTA_SIGNING_KEY_B64:?OTA_SIGNING_KEY_B64 secret is required}"
          version="$(tr -d '\r\n' < release/VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${PREVIEW_RELEASE_TAG}" =~ ^preview-v${version//./\\.}-[1-9][0-9]*$ ]]
          tag="${PREVIEW_RELEASE_TAG}"
          key_file="$(mktemp)"
          cleanup() { rm -f "${key_file}"; }
          trap cleanup EXIT
          printf '%s' "${OTA_SIGNING_KEY_B64}" | base64 --decode > "${key_file}"
          chmod 600 "${key_file}"
          python3 publishing-policy/scripts/ota_manifest.py generate \
            --firmware "release/sugarclock-v${version}.bin" \
            --firmware-url "https://github.com/cdemeke/SugarClock/releases/download/${tag}/sugarclock-v${version}.bin" \
            --version-file release/VERSION \
            --minimum-ota-version 0.2.0 \
            --channel preview \
            --key-id release-2026-01 \
            --private-key "${key_file}" \
            --public-key publishing-policy/keys/ota-release-2026-01-public.pem \
            --output release/ota-manifest.json \
            --signature-output release/ota-manifest.sig
          python3 publishing-policy/scripts/ota_manifest.py verify \
            --manifest release/ota-manifest.json \
            --channel preview \
            --public-key publishing-policy/keys/ota-release-2026-01-public.pem
          rm release/VERSION
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${PREVIEW_RELEASE_TAG}"
          gh release create "${tag}" release/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --generate-notes \
            --title "SugarClock ${tag}"
      - name: Verify legacy Latest tag and manifest were preserved
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publishing-policy/scripts/release_guard.py --repository "${{ github.repository }}" check --expected "${{ runner.temp }}/latest-before.json"
