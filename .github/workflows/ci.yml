name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            fleet/requirements.txt
      - run: pip install -r requirements-build.txt
      - run: pip install -r fleet/requirements.txt
      - name: Host security and policy tests
        run: python -m unittest discover -s tests -v
      - name: Build firmware and installer filesystem
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pio run && pio run -t buildfs; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "PlatformIO registry failed; retrying build (attempt $((attempt + 1))/3)"
            sleep $((attempt * 15))
          done
      - name: Verify partitions, versions, rollback, and size limits
        run: python scripts/check_layout.py
      - name: Confirm generated sources are reproducible
        run: |
          python scripts/pre_build.py
          git diff --exit-code -- docs/manifest.json include/web_assets.h src/web_assets.cpp
