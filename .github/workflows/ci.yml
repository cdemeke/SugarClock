name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            fleet/requirements.txt
      - run: pip install -r requirements-build.txt
      - run: pip install -r fleet/requirements.txt
      - name: Host security and policy tests
        run: python -m unittest discover -s tests -v
      - name: Build firmware and installer filesystem
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pio run && pio run -t buildfs; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "PlatformIO registry failed; retrying build (attempt $((attempt + 1))/3)"
            sleep $((attempt * 15))
          done
      - name: Verify partitions, versions, rollback, and size limits
        run: python scripts/check_layout.py
      - name: Confirm generated sources are reproducible
        run: |
          python scripts/pre_build.py
          git diff --exit-code -- include/web_assets.h src/web_assets.cpp

  fleet-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fleet service image
        run: docker build --tag sugarfleet-ci --file fleet/Dockerfile .
      - name: Smoke test non-root service and health check
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm --force sugarfleet-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name sugarfleet-ci \
            --env FLEET_SECRET_KEY=ci-secret-key-with-at-least-32-characters \
            --env FLEET_DEVICE_CREDENTIAL_PEPPER=ci-device-pepper-with-at-least-32-characters \
            --env FLEET_INSECURE_COOKIES=1 \
            sugarfleet-ci
          test "$(docker inspect --format '{{.Config.User}}' sugarfleet-ci)" = "10001:10001"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' sugarfleet-ci)"
            if [ "${status}" = healthy ]; then
              exit 0
            fi
            if [ "${status}" = unhealthy ] || [ "$(docker inspect --format '{{.State.Running}}' sugarfleet-ci)" != true ]; then
              docker logs sugarfleet-ci
              exit 1
            fi
            sleep 1
          done
          docker logs sugarfleet-ci
          exit 1
